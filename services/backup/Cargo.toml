[package]
name = "bwbackup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "bwbackup — Black Wall Core Backup Manager"

[lib]
name = "bwbackup"
path = "src/lib.rs"

[[bin]]
name = "bwbackup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"