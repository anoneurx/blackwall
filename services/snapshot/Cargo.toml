[package]
name = "bwsnap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "bwsnap — Black Wall Core Snapshot Manager"

[lib]
name = "bwsnap"
path = "src/lib.rs"

[[bin]]
name = "bwsnap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }