[package]
name = "anx-repo-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Black Wall Core - Secure Package Repository Server"

[[bin]]
name = "anx-repo-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
